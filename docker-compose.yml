name: wat
# Service -> 각자 역할 분담.
# 아래에 있는 mysql, redis, rabbitmq, backend, frontend 등이 각각 하나의 독립된 컨테이너가 됨.
services:
  # mysql, redis, rabbitmq 처럼 이미 만들어진 것들은 외부에서 image로 가져와서 사용.
  mysql:
    image: mysql:8.4
    container_name: wat-mysql

    # 왼쪽 : 로컬, 오른쪽 : 컨테이너 내부 포트(mysql 기본포트)
    ports:
      - "3307:3306"

    # 설정 주입
    environment:
      # ${...} -> 보안을 위해 .env파일에 따로 저장된 값 불러오기.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    # 컨테이너는 껏다 키면 데이터 날아감
    volumes:
      - mysql-data:/var/lib/mysql # 컨테이너 삭제되어도 db데이터 로컬 mysql-data에 보관하라.

    # healthcheck -> 준비신호 보낼 때까지 체크.
    # depends_on -> healthcheck완료될때까지 실행하지말고 대기.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: wat-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: wat-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 직접 만든 backend, frontend는 Dockerfile을 읽어서 image 새로 build하여 실행.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-backend
    ports:
      - "8080:8080"
    environment:
      # local -> seed, 로컬용
      # k6 -> 테스트 컨트롤러 활성화용
      SPRING_PROFILES_ACTIVE: local, k6

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PORTONE_STORE_ID: ${VITE_PORTONE_STORE_ID}
        VITE_PORTONE_CHANNEL_KEY: ${VITE_PORTONE_CHANNEL_KEY}
    container_name: wat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data: